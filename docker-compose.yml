version : '3.9'
services:
  db:
    image: postgres:16
    container_name: pgl_db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  app:
    build: .
    container_name: pgl_app
    restart: unless-stopped
    env_file:
      - .env.app.docker
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:






