<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGL Astana 2026 — Matches</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="cursor"></div>
<div id="cursor-trail"></div>
<canvas id="particles"></canvas>

<div id="app">

  <nav class="nav">
    <a class="nav-logo" href="index.html">PGL ASTANA 2026</a>
    <div class="nav-links">
      <a class="nav-btn" href="index.html">Home</a>
      <a class="nav-btn" href="teams.html">Teams</a>
      <a class="nav-btn" href="matches.html">Matches</a>
    </div>
    <div class="nav-right">
      <div class="live-dot" id="live-indicator">LIVE</div>
      <div class="nav-date" id="nav-date"></div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="section">
      <div class="sec-head">
        <div class="sec-num">03</div>
        <div class="sec-title">Match Schedule</div>
        <div class="sec-line"></div>
        <div class="sec-count" id="matches-count"></div>
      </div>
      <div class="filters" id="status-filters"></div>
      <div class="filters" id="stage-filters"></div>
      <div id="matches-wrap"></div>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
<script>
let _matches = [];
let currentStatus = 'all';
let currentStage  = 'all';

async function loadMatches() {
  document.getElementById('matches-wrap').innerHTML = loaderHTML('Loading matches');
  try {
    _matches = await apiFetch('/matches');

    const liveCount = _matches.filter(m => isLive(m.status)).length;
    if (liveCount > 0) document.getElementById('live-indicator').classList.add('visible');

    document.getElementById('matches-count').textContent = _matches.length + ' matches';
    buildFilters();
    renderList();
  } catch(e) {
    document.getElementById('matches-wrap').innerHTML = errHTML('Failed to load matches.');
  }
}

function buildFilters() {
  const statuses = ['all', ...new Set(_matches.map(m => m.status).filter(Boolean))];
  const stages   = ['all', ...new Set(_matches.map(m => m.stage).filter(Boolean))];

  document.getElementById('status-filters').innerHTML =
    statuses.map(s =>
      `<button class="filter-pill${s === currentStatus ? ' active' : ''}" onclick="setStatus('${s}',this)">
        ${s === 'all' ? 'All Statuses' : s}
      </button>`
    ).join('');

  document.getElementById('stage-filters').innerHTML =
    stages.map(s =>
      `<button class="filter-pill${s === currentStage ? ' active' : ''}" onclick="setStage('${s}',this)" style="border-color:rgba(255,45,120,0.2);color:var(--m)">
        ${s === 'all' ? 'All Stages' : s}
      </button>`
    ).join('');
}

function setStatus(s, btn) {
  currentStatus = s;
  document.querySelectorAll('#status-filters .filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function setStage(s, btn) {
  currentStage = s;
  document.querySelectorAll('#stage-filters .filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  let filtered = _matches;
  if (currentStatus !== 'all') filtered = filtered.filter(m => m.status === currentStatus);
  if (currentStage  !== 'all') filtered = filtered.filter(m => m.stage  === currentStage);

  if (!filtered.length) {
    document.getElementById('matches-wrap').innerHTML =
      `<div style="color:var(--dim);font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:3px;padding:80px;text-align:center">NO MATCHES FOUND</div>`;
    return;
  }

  document.getElementById('matches-wrap').innerHTML =
    `<div class="matches-list">
      ${filtered.map((m, i) =>
        `<div style="animation:rise .35s ${i * 0.03}s both">
          ${matchRowHTML(m, `match.html?id=${m.id}`)}
        </div>`
      ).join('')}
    </div>`;
}

sharedInit();
loadMatches();
</script>
</body>
</html>
