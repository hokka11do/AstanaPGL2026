<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGL Astana 2026 — Матчи</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js" defer></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/matches.js"></script>
</head>
<body class="page">
  <nav class="top-nav" id="site-nav"></nav>
  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="hero-mini">
    <div class="container">
      <div class="panel">
        <div class="breadcrumbs">
          <a href="index.html">Главная</a><span>•</span><span>Матчи</span>
        </div>
        <h1>Матчи и серии</h1>
        <p>Фильтры, карточки матчей, переход на серию, а внутри — карты по очереди. Без хаоса, без старого шаблонного вида, только нормальный киберспорт-фронт.</p>
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:28px;">
    <div class="container">
      <div class="filters">
        <label class="search"><input id="match-search" type="text" placeholder="Поиск по команде, стадии, формату"></label>
        <select class="select" id="match-status">
          <option value="">Все статусы</option>
          <option value="upcoming">Скоро</option>
          <option value="live">Live</option>
          <option value="finished">Завершен</option>
          <option value="postponed">Перенесен</option>
          <option value="canceled">Отменен</option>
        </select>
      </div>
      <div class="grid match-grid" id="matches-root"></div>
    </div>
  </section>

  <footer class="footer" id="site-footer"></footer>
</body>
</html>
