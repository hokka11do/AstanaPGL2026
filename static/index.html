<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGL Astana 2026 — Главная</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js" defer></script>
  <script defer src="/static/js/core.js"></script>
  <script defer src="/static/js/index.js"></script>
</head>
<body class="page">
  <nav class="top-nav" id="site-nav"></nav>
  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="hero">
    <div class="hero-slider" id="hero-slides"></div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>Команды <br>сцены</h2>
        </div>
        <p>Пять хедлайнеров главной сцены: жёсткий свет, быстрые переходы, капитан рядом с командой и подача без лишнего шума.</p>
      </div>
      <div class="grid team-grid" id="top-teams"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head">
        <div>
          <h2>Сетка <br>давления</h2>
        </div>
        <p>Ближайшие матчи вынесены сразу под hero: переход в один клик, счёт на виду, карты внутри идут по порядку без хаоса.</p>
      </div>
      <div class="grid match-grid" id="recent-matches"></div>
    </div>
  </section>

  <footer class="footer" id="site-footer"></footer>
</body>
</html>
