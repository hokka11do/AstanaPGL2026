<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGL Astana 2026 — Команды</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js" defer></script>
  <script defer src="js/core.js"></script>
  <script defer src="js/teams.js"></script>
</head>
<body class="page">
  <nav class="top-nav" id="site-nav"></nav>
  <div class="mobile-menu" id="mobile-menu"></div>

  <section class="hero-mini">
    <div class="container">
      <div class="panel">
        <div class="breadcrumbs">
          <a href="index.html">Главная</a><span>•</span><span>Команды</span>
        </div>
        <h1>Команды турнира</h1>
        <p>Все участники в одном месте: логотипы, регионы, переходы на составы и отдельные страницы игроков. Без воды, зато с вайбом арены и металлом в воздухе.</p>
      </div>
    </div>
  </section>
  <section class="section" style="padding-top:28px;">
    <div class="container">
      <div class="filters">
        <label class="search"><input id="team-search" type="text" placeholder="Поиск по названию, тегу, региону"></label>
        <select class="select" id="team-region">
          <option value="">Все регионы</option>
          <option value="cis">CIS</option>
          <option value="europe">Европа</option>
          <option value="asia">Азия</option>
          <option value="north_america">Северная Америка</option>
          <option value="south_america">Южная Америка</option>
          <option value="oceania">Океания</option>
        </select>
      </div>
      <div class="grid team-grid" id="teams-root"></div>
    </div>
  </section>

  <footer class="footer" id="site-footer"></footer>
</body>
</html>
