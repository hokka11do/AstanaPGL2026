<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGL Astana 2026 — Teams</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="cursor"></div>
<div id="cursor-trail"></div>
<canvas id="particles"></canvas>

<div id="app">

  <nav class="nav">
    <a class="nav-logo" href="index.html">PGL ASTANA 2026</a>
    <div class="nav-links">
      <a class="nav-btn" href="index.html">Home</a>
      <a class="nav-btn" href="teams.html">Teams</a>
      <a class="nav-btn" href="matches.html">Matches</a>
    </div>
    <div class="nav-right">
      <div class="live-dot" id="live-indicator">LIVE</div>
      <div class="nav-date" id="nav-date"></div>
    </div>
  </nav>

  <div class="page-wrap">
    <div class="section">
      <div class="sec-head">
        <div class="sec-num">02</div>
        <div class="sec-title">Participating Teams</div>
        <div class="sec-line"></div>
        <div class="sec-count" id="teams-count"></div>
      </div>
      <div class="filters" id="region-filters"></div>
      <div id="teams-grid-wrap"></div>
    </div>
  </div>

</div>

<script src="js/app.js"></script>
<script>
let _teams = [];
let currentRegion = 'all';

async function loadTeams() {
  document.getElementById('teams-grid-wrap').innerHTML = loaderHTML('Loading teams');
  try {
    _teams = await apiFetch('/teams');
    document.getElementById('teams-count').textContent = _teams.length + ' teams';
    buildFilters();
    renderGrid();
  } catch(e) {
    document.getElementById('teams-grid-wrap').innerHTML = errHTML('Failed to load teams. Check API connection.');
  }
}

function buildFilters() {
  const regions = ['all', ...new Set(_teams.map(t => t.region).filter(Boolean))];
  document.getElementById('region-filters').innerHTML = regions.map(r =>
    `<button class="filter-pill${r === currentRegion ? ' active' : ''}" onclick="setRegion('${r}', this)">
      ${r === 'all' ? 'All Regions' : r}
    </button>`
  ).join('');
}

function setRegion(r, btn) {
  currentRegion = r;
  document.querySelectorAll('#region-filters .filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const filtered = currentRegion === 'all' ? _teams : _teams.filter(t => t.region === currentRegion);
  document.getElementById('teams-grid-wrap').innerHTML = `
    <div class="teams-grid">
      ${filtered.map((t, i) => `
        <a class="team-card" href="team.html?slug=${t.slug}" style="animation:rise .5s ${i * 0.04}s both">
          <div class="tc-corner"></div>
          ${logoEl(t.logo_url, t.name, 'tc-logo', 'tc-logo-ph')}
          <div class="tc-name">${t.name}</div>
          <div class="tc-tags">
            ${t.region      ? `<span class="chip chip-c">${t.region}</span>` : ''}
            ${t.country_code? `<span class="chip chip-dim">${t.country_code.toUpperCase()}</span>` : ''}
            ${t.short_name && t.short_name !== t.name ? `<span class="chip chip-m">${t.short_name}</span>` : ''}
          </div>
        </a>
      `).join('')}
    </div>`;
}

sharedInit();
loadTeams();
</script>
</body>
</html>
